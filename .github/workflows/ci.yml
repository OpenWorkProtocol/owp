name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify RC3 normative artifacts
        run: |
          set -euo pipefail
          grep -q 'MIT License' LICENSE
          test -f spec/owp-1.0-rc3.md
          test -f spec/annex-http-1.0-rc3.md
          test -f spec/annex-software-work-integrity-1.0-rc3.md
          node tools/build-requirement-matrix.mjs
          git diff --exit-code -- REQUIREMENTS.json CONFORMANCE_MATRIX.md
          grep -q 'Assessment result: \*\*READY FOR IMPLEMENTATION REVIEW\*\*' RELEASE_READINESS.md
      - name: Verify Software Work Integrity schemas
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          for (const file of fs.readdirSync('schemas').filter(x => x.endsWith('.json'))) {
            JSON.parse(fs.readFileSync(`schemas/${file}`, 'utf8'));
            console.log(`ok schema ${file}`);
          }
          NODE
      - name: Run portable Software Work Integrity vectors
        run: node tools/test-software-work-integrity-vectors.mjs
      - name: Run adversarial real-Git Software Work Integrity tests
        run: node tools/test-software-work-integrity.mjs
      - name: Verify project URLs and public-surface boundaries
        run: node tools/test-project-surface.mjs
      - name: Verify static website
        run: node tools/test-site.mjs
      - name: Verify documentation local links
        run: node tools/test-doc-links.mjs
      - name: Run Try OWP template source smoke
        run: OWP_TEMPLATE_SOURCE=1 bash templates/try-owp/scripts/smoke.sh
      - name: Render and smoke a standalone Try OWP deployment
        run: |
          tmp="$(mktemp -d)"
          ./scripts/new-try-owp.sh "$tmp/field-lab" --operator "CI Operator" --hostname "try-ci.example.com" --provider-id "provider:ci" --no-test
          (cd "$tmp/field-lab" && ./scripts/smoke.sh)
